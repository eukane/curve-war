<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Curve War</title>
  <style>
    :root { color-scheme: light dark; --bg:#f1f4f6; --fg:#14202b; --mu:#5a6b79; --line:#c5d0d9; --panel:#fff; --ac:#1f64d6; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d141a; --fg:#e3ebf2; --mu:#8fa3b3; --line:#26384a; --panel:#131d26; --ac:#5ba4ff; } }
    body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.6 system-ui, "Noto Sans KR", sans-serif; }
    main { max-width: 860px; margin: 0 auto; display:flex; flex-direction:column; gap:16px; }
    h1 { margin:0; font-size:22px; } h2 { margin:0 0 8px; font-size:15px; }
    .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    button { font:inherit; padding:4px 12px; border:1px solid var(--line); background:var(--panel); color:var(--fg); border-radius:3px; cursor:pointer; }
    button[aria-pressed="true"] { background:var(--fg); color:var(--bg); }
    section { background:var(--panel); border:1px solid var(--line); padding:12px 16px; border-radius:4px; }
    table { border-collapse:collapse; width:100%; font-variant-numeric: tabular-nums; }
    td, th { text-align:left; padding:3px 8px 3px 0; border-bottom:1px solid var(--line); vertical-align:top; }
    td.n { text-align:right; white-space:nowrap; }
    .mu { color: var(--mu); } code { font-size:12px; }
    .wrapx { overflow-x:auto; }
  </style>
</head>
<body>
  <main>
    <h1>Curve War <span class="mu" style="font-size:13px">M1 시험 화면 — 인구·식량 코어</span></h1>
    <div class="row" id="controls"></div>
    <section><h2 id="date"></h2><div class="wrapx" id="summary"></div></section>
    <section><h2>왜 이 값인가 — 최근 수확</h2><div class="wrapx" id="harvest"></div></section>
    <section><h2>왜 이 값인가 — 이번 달 인구 변화</h2><div class="wrapx" id="demog"></div></section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
