<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Curve War</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
  <style>
    :root {
      --bg: #e9eef2; --panel: #f8fafb; --fg: #12202c; --mu: #5a6b79; --line: #c3cfd9;
      --a: #1f64d6; --good: #17794a; --bad: #c12a4a; --warn: #a56a00;
      --mono: "IBM Plex Mono", ui-monospace, monospace; --sans: "Noto Sans KR", system-ui, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0b1218; --panel:#121c25; --fg:#e3ebf2; --mu:#8fa3b3; --line:#26384a; --a:#5ba4ff; --good:#4cc38a; --bad:#ff7a93; --warn:#f0b24a; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 var(--sans);
      padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:20px 56px; }
    main { max-width:1040px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
    h1 { margin:0; font-size:24px; font-weight:900; letter-spacing:-.01em; }
    h1 small { font:400 12px var(--mono); color:var(--mu); margin-left:8px; letter-spacing:0; }
    h2 { margin:0 0 8px; font-size:15px; font-weight:700; }
    h3 { margin:12px 0 4px; font-size:13px; font-weight:700; }
    .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .grid2 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px; }
    @media (max-width:820px) { .grid2 { grid-template-columns:minmax(0,1fr); } }
    section { background:var(--panel); border:1px solid var(--line); padding:14px 16px; border-radius:4px; min-width:0; }
    button { font:inherit; padding:4px 12px; border:1px solid var(--line); background:var(--panel); color:var(--fg); border-radius:3px; cursor:pointer; }
    button:focus-visible, input:focus-visible { outline:2px solid var(--a); outline-offset:2px; }
    button[aria-pressed="true"] { background:var(--fg); color:var(--bg); border-color:var(--fg); }
    button.primary { background:var(--a); color:#fff; border-color:var(--a); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
    td, th { text-align:left; padding:3px 10px 3px 0; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-weight:500; color:var(--mu); font-size:12px; }
    td.n, th.n { text-align:right; white-space:nowrap; }
    td:first-child, th:first-child { white-space:nowrap; }
    table.wide { min-width:560px; }
    .mu { color:var(--mu); } .mono { font-family:var(--mono); } .good { color:var(--good); } .bad { color:var(--bad); } .warn { color:var(--warn); }
    code { font:12px var(--mono); }
    .wrapx { overflow-x:auto; }
    .meter { height:8px; background:var(--line); border-radius:2px; overflow:hidden; margin:4px 0 2px; }
    .meter > i { display:block; height:100%; background:var(--a); }
    .field { display:grid; grid-template-columns:7em minmax(0,1fr) 7em; gap:8px; align-items:center; margin:6px 0; }
    .field input[type=range] { width:100%; accent-color:var(--a); }
    .field output { font:13px var(--mono); text-align:right; }
    .log { max-height:260px; overflow:auto; margin:0; padding:0; list-style:none; }
    .log li { padding:4px 0; border-bottom:1px solid var(--line); display:grid; grid-template-columns:8.5em minmax(0,1fr); gap:8px; }
    .log li.empty { display:block; }
    .log time { font:12px var(--mono); color:var(--mu); }
    #modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-start; justify-content:center; padding:max(16px, env(safe-area-inset-top, 0px)) 16px 16px; overflow:auto; z-index:20; }
    #modal[hidden] { display:none; }
    #modal .card { background:var(--panel); border:1px solid var(--line); border-radius:4px; width:min(820px,100%); padding:18px 20px; }
    .opt { border:1px solid var(--line); border-radius:3px; padding:10px 12px; margin:10px 0; }
    .opt .head { display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center; margin-bottom:6px; font-weight:700; }
    .note { font-size:12px; color:var(--mu); }
  </style>
</head>
<body>
  <main>
    <h1>Curve War<small>M1.5 시험 화면 — 인구·식량·개간</small></h1>
    <div class="row" id="controls" role="group" aria-label="시간 조작"></div>
    <section><h2 id="date"></h2><div class="wrapx" id="summary"></div></section>
    <section id="clear-section"><h2>개간 사업</h2><div id="clear-panel"></div></section>
    <div class="grid2">
      <section><h2>왜 이 값인가 — 올해 파종</h2><div class="wrapx" id="why-sow"></div></section>
      <section><h2>왜 이 값인가 — 최근 수확</h2><div class="wrapx" id="why-harvest"></div></section>
    </div>
    <section><h2>왜 이 값인가 — 이번 달 인구 변화</h2><div class="wrapx" id="why-demog"></div></section>
    <section><h2>기록</h2><ul class="log" id="log"></ul></section>
  </main>
  <div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="card" id="modal-card"></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
